[project]
name = "spatial-polygon-merging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.3",
    "imagecodecs>=2026.3.6",
    "ipykernel>=7.2.0",
    "pulp>=3.3.1",
    "python-dotenv>=1.2.2",
    "rasterio>=1.4.4",
    "sahi>=0.11.36",
    "shapely>=2.1.2",
    "supervision>=0.28.0",
    "tifffile>=2026.3.3",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "ultralytics>=8.4.52",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
